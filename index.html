function proxyEncode(str) {

function proxiedUrl(url) { return 'proxy.php?url=' + proxyEncode(url); }

// Fallback engine used when JW Player's bundled HLS engine can't handle a
// stream (a common cause of "channel won't play at all" on multi-audio-track
// manifests, or on sources that block direct browser requests). hls.js has
// much more mature multi-audio-track support and exposes it simply via
// hlsInstance.audioTracks / hlsInstance.audioTrack. If even that fails
// outright (often a Referer/CORS block from the source), we retry once more
// through our own server-side proxy, which many other IPTV sites rely on
// for exactly this reason.
function setupHlsFallback(url, viaProxy) {
    usingHlsFallback = true;
    mainPlayerDiv.style.display = 'none';
    fallbackVideo.style.display = 'block';
    var loadUrl = viaProxy ? proxiedUrl(url) : url;
    if (window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls();
        hlsInstance.loadSource(loadUrl);
        hlsInstance.attachMedia(fallbackVideo);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
            fallbackVideo.play().catch(function() {});
            hidePlayerLoading();
        });
        hlsInstance.on(Hls.Events.AUDIO_TRACKS_UPDATED, function() {
            populateAudioTracks((hlsInstance.audioTracks || []).map(function(t) { return { name: t.name || t.lang || 'Audio' }; }));
        });
        hlsInstance.on(Hls.Events.ERROR, function(event, data) {
            console.log('hls.js error:', data.type, data.details, data.fatal, 'viaProxy:', !!viaProxy);
            if (data.fatal) {
                if (!viaProxy && (data.type === Hls.ErrorTypes.NETWORK_ERROR || data.type === Hls.ErrorTypes.MEDIA_ERROR)) {
                    // Direct connection to the source failed outright — this is
                    // the classic signature of a Referer/CORS-blocked stream.
                    // Retry once through our own server-side proxy before giving up.
                    try { hlsInstance.destroy(); } catch(e) {}
                    setupHlsFallback(url, true);
                    armStallTimer(url, 'hls-proxy');
                    return;
                }
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) { hlsInstance.startLoad(); }
                else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { hlsInstance.recoverMediaError(); }
                else { hidePlayerLoading(); showPlayerError('Stream error — this channel could not be loaded'); }
            }
        });
    } else if (fallbackVideo.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari: native HLS, no separate JS engine needed.
        fallbackVideo.src = loadUrl;
        var onLoaded = function() {
            fallbackVideo.play().catch(function() {});
            hidePlayerLoading();
            fallbackVideo.removeEventListener('loadedmetadata', onLoaded);
        };
        fallbackVideo.addEventListener('loadedmetadata', onLoaded);
        fallbackVideo.addEventListener('error', function() {
            if (!viaProxy) { setupHlsFallback(url, true); armStallTimer(url, 'hls-proxy'); return; }
            hidePlayerLoading();
            showPlayerError('Stream error — this channel could not be loaded');
        });
    } else {
        hidePlayerLoading();
        showPlayerError("Your browser can't play this stream");
    }
}

let stallTimer = null;
function clearStallTimer() { if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; } }

// Some sources never fire a player "error" event when they're actually
// unreachable (blocked by Referer/CORS, or just silently dead) — the player
// just sits on "Buffering..." forever. This watchdog escalates through the
// same JW → hls.js direct → hls.js via proxy chain as a real error would,
// instead of leaving the viewer stuck looking at a spinner.
function armStallTimer(url, stage) {
    clearStallTimer();
    stallTimer = setTimeout(function() {
        if (!isLoading) return; // already succeeded (or moved to a different channel) — nothing to do
        console.log('Playback stalled at stage "' + stage + '" — escalating fallback');
        if (stage === 'jw') {
            if (jwInstance) { try { jwInstance.remove(); } catch(e) {} jwInstance = null; }
            setupHlsFallback(url, false);
            armStallTimer(url, 'hls-direct');
        } else if (stage === 'hls-direct') {
            if (hlsInstance) { try { hlsInstance.destroy(); } catch(e) {} hlsInstance = null; }
            setupHlsFallback(url, true);
            armStallTimer(url, 'hls-proxy');
        } else {
            hidePlayerLoading();
            showPlayerError('Stream error — this channel could not be loaded (timed out)');
        }
    }, 15000);
}

function setupJWPlayer(url, isRetry) {
    try {
        jwInstance = jwplayer("main-player").setup({
            file: url, width: "100%", height: "100%", autostart: true, primary: "html5", mute: false
        });
        jwInstance.on('ready', hidePlayerLoading);
        jwInstance.on('play', hidePlayerLoading);
        // Multi-audio-track channels: JW Player exposes the tracks found in
        // the HLS manifest here — this is what lets a viewer pick between
        // e.g. Bangla/English commentary instead of the stream failing to
        // show anything useful.
        jwInstance.on('audioTracks', function(e) { populateAudioTracks(e.tracks); });
        jwInstance.on('audioTrackChanged', function(e) {
            if (audioTrackSelect.options.length) audioTrackSelect.value = e.currentTrack;
        });
        jwInstance.on('error', function(e) {
            console.log('JW Player error:', e && e.code, e && e.message);
            if (!isRetry) {
                // A number of "channel won't play at all" reports turn out to be a
                // one-time manifest/segment hiccup (common on multi-audio-track
                // streams where the extra audio playlist is fetched first) — retry
                // once automatically before falling back.
                setTimeout(function() { setupJWPlayer(url, true); }, 1200);
                return;
            }
            // JW's bundled engine couldn't play this stream at all — fall back to
            // hls.js, which has broader multi-audio-track manifest support.
            if (jwInstance) { try { jwInstance.remove(); } catch(e2) {} jwInstance = null; }
            setupHlsFallback(url);
            armStallTimer(url, 'hls-direct');
        });
        jwInstance.on('buffer', function() {
            if (!isLoading) { showPlayerLoading(currentChannelName, currentLogoUrl); loadingSubText.textContent = 'Buffering...'; }
        });
    } catch(e) { console.log('JW Player setup error:', e); hidePlayerLoading(); showPlayerError('Failed to load stream'); }
}

function detectAdblockAndNotify() {
    var results = { cosmetic: false, network: false };

    function maybeShowNotice() {
        var blocked = results.cosmetic || results.network;
        if (blocked && !localStorage.getItem('adblockNoticeDismissed') && !document.getElementById('adblockNoticeBar')) {
            var notice = document.createElement('div');
            notice.id = 'adblockNoticeBar';
            notice.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:rgba(20,20,20,0.97);color:#fff;padding:10px 14px;font-size:0.75rem;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:999;border-top:1px solid rgba(255,255,255,0.15);';
            notice.innerHTML = '<span>এই সাইট বিনামূল্যে চালু রাখতে বিজ্ঞাপনের প্রয়োজন — Ad-blocker/DNS ব্লকিং বন্ধ রাখলে আমাদের সাহায্য হয়। 🙏</span>';
            var closeBtn = document.createElement('button');
            closeBtn.textContent = '✕';
            closeBtn.style.cssText = 'background:none;border:none;color:#fff;font-size:1rem;cursor:pointer;flex-shrink:0;';
            closeBtn.onclick = function() {
                notice.remove();
                localStorage.setItem('adblockNoticeDismissed', '1');
            };
            notice.appendChild(closeBtn);
            document.body.appendChild(notice);
        }
    }

    // 1) Cosmetic-filter detection (catches browser extensions like uBlock/AdBlock
    // that hide elements matching known ad-related class names).
    var bait = document.createElement('div');
    bait.className = 'adsbox ad-banner ads advertisement';
    bait.style.cssText = 'position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;';
    document.body.appendChild(bait);
    setTimeout(function() {
        results.cosmetic = (bait.offsetParent === null || bait.offsetHeight === 0);
        try { document.body.removeChild(bait); } catch(e) {}
        maybeShowNotice();
    }, 600);

    // 2) Network-level detection (catches DNS-based blocking like Pi-hole/NextDNS/
    // AdGuard DNS, which blocks the request itself rather than hiding an element).
    var testScript = document.createElement('script');
    var settled = false;
    var networkTimeout = setTimeout(function() {
        if (!settled) { settled = true; results.network = true; maybeShowNotice(); }
    }, 2500);
    testScript.onerror = function() {
        if (!settled) { settled = true; clearTimeout(networkTimeout); results.network = true; maybeShowNotice(); }
    };
    testScript.onload = function() {
        setTimeout(function() {
            if (!settled) {
                settled = true;
                clearTimeout(networkTimeout);
                // Some blockers (Brave Shields, uBlock, AdGuard) don't fail the
                // request — they serve an empty stub with a 200 OK so onerror
                // never fires. Real adsbygoogle.js defines window.adsbygoogle,
                // so if that's missing, the response was substituted/blocked.
                results.network = (typeof window.adsbygoogle === 'undefined');
                maybeShowNotice();
            }
        }, 150);
    };
    testScript.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?_=' + Date.now();
    document.head.appendChild(testScript);
}
detectAdblockAndNotify();

            ];

        var storedNotice = localStorage.getItem('noticeText');

        var storedVisibility = localStorage.getItem('categoryVisibility');
        if (storedVisibility) { try { categoryVisibility = normalizeVisibility(JSON.parse(storedVisibility)); } catch(e) {} }
        refreshAllAdSlots();

    });

function renderCategoryTabs(categoryCount) {

    });

    var visibleTotal = 0;
    Object.keys(categoryCount).forEach(function(c) { visibleTotal += categoryCount[c]; });

    var html = '<button class="cat-tab" data-type="all">All (' + visibleTotal + ')</button>';
    orderedCats.forEach(function(cat) {
        html += '<button class="cat-tab" data-type="' + escapeHTML(cat) + '">' + escapeHTML(cat) + ' (' + categoryCount[cat] + ')</button>';
    });
    container.innerHTML = html;

    tabs = document.querySelectorAll('.cat-tab');
    var stillExists = previousActive === 'all' || orderedCats.indexOf(previousActive) !== -1;
    var activeType = stillExists ? previousActive : 'all';
    activeCategory = activeType;

    tabs.forEach(function(tab) {
        if (tab.dataset.type === activeType) tab.classList.add('active');
        tab.onclick = function() {
            tabs.forEach(function(t) { t.classList.remove('active'); });
            tab.classList.add('active');
            activeCategory = tab.dataset.type;
            filterChannels();
        };
    });
}

function renderChannels() {
    var categoryCount = {};
    items = [];
    listBar.innerHTML = '';
    var displayChannels = allChannels.filter(function(ch) {
        var isVisible = categoryVisibility[ch.category] !== false;
        return ch.status !== 'hidden' && isVisible;
    });
    if (displayChannels.length === 0) {
        listBar.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text3);grid-column:1/-1;font-size:0.8rem;">No channels found</div>';
        return;
    }
    var topChannels = [], normalChannels = [];
    displayChannels.forEach(function(ch) {
        var isTop = top20Channels.some(function(t) { return t.name === ch.name && t.url === ch.url; });
        if (isTop) topChannels.push(ch);
        else normalChannels.push(ch);
    });
    topChannels.sort(function(a, b) {
        var indexA = top20Channels.findIndex(function(t) { return t.name === a.name && t.url === a.url; });
        var indexB = top20Channels.findIndex(function(t) { return t.name === b.name && t.url === b.url; });
        return indexA - indexB;
    });
    normalChannels.sort(function(a, b) { return allChannels.indexOf(a) - allChannels.indexOf(b); });
    var sortedChannels = topChannels.concat(normalChannels);
    sortedChannels.forEach(function(ch, idx) {
        var originalIndex = allChannels.indexOf(ch);
        categoryCount[ch.category] = (categoryCount[ch.category] || 0) + 1;
        var li = document.createElement('li');
        li.className = 'channel-item';
        if (ch.status === 'hidden') li.classList.add('hidden-channel');
        if (ch._status === 'offline' || ch._status === 'dead') li.classList.add('offline-channel');
        if (currentPlayingIndex === originalIndex) li.classList.add('active');
        li.dataset.name = ch.name.toLowerCase();
        li.dataset.category = ch.category;
        li.dataset.index = originalIndex;
        var logoUrl = ch.logo && ch.logo !== '' ? ch.logo : getDefaultLogo(ch.name);
        var statusText = (ch.status === 'active' ? 'Active' : 'Hidden');
        var statusClass = ch.status;
        if (ch._status === 'online') { statusText = 'Online'; statusClass = 'online'; }
        else if (ch._status === 'offline' || ch._status === 'dead') { statusText = 'Offline'; statusClass = 'offline'; }
        else if (ch._status === 'checking') { statusText = 'Checking...'; statusClass = 'checking'; }
        li.innerHTML = '<div class="logo-wrapper"><img src="' + escapeHTML(logoUrl) + '" class="channel-logo" alt="' + escapeHTML(ch.name) + '" loading="lazy" decoding="async" onerror="this.src=\'' + getDefaultLogo(ch.name) + '\'"></div><div class="channel-name">' + escapeHTML(ch.name) + '</div><span class="channel-status-badge ' + statusClass + '">' + statusText + '</span>';
        li.onclick = function(e) {
            if (ch.status === 'hidden') { alert('This channel is hidden.'); return; }
            playChannelWithLoading(ch, originalIndex);
        };
        listBar.appendChild(li);
        items.push(li);
    });
    var visibleChannels = allChannels.filter(function(ch) {
        var isVisible = categoryVisibility[ch.category] !== false;
        return ch.status !== 'hidden' && isVisible;
    });
    renderCategoryTabs(categoryCount);
    var hasActive = document.querySelector('.channel-item.active');
    if (!hasActive && items.length > 0 && currentPlayingIndex === -1) {
        var firstVisible = allChannels.findIndex(function(ch) {
            var isVisible = categoryVisibility[ch.category] !== false;
            return ch.status !== 'hidden' && isVisible;
        });
        if (firstVisible !== -1) {
            setTimeout(function() {
                var item = document.querySelector('.channel-item[data-index="' + firstVisible + '"]');
                if (item) item.click();
            }, 300);
        }
    }
    updateStats();
}

function filterChannels() {
    var q = search.value.toLowerCase().trim();
    items.forEach(function(i, idx) {
        var index = parseInt(i.dataset.index);
        var ch = allChannels[index];
        if (!ch) { i.style.display = 'none'; return; }
        if (ch.status === 'hidden') { i.style.display = 'none'; return; }
        var isVisible = categoryVisibility[ch.category] !== false;
        if (!isVisible) { i.style.display = 'none'; return; }
        var matchName = ch.name.toLowerCase().indexOf(q) !== -1;
        var matchCat = (activeCategory === 'all' || ch.category === activeCategory);
        i.style.display = (matchName && matchCat) ? 'flex' : 'none';
    });
}

search.addEventListener('input', filterChannels);
tabs.forEach(function(tab) {
    tab.onclick = function() {
        tabs.forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        activeCategory = tab.dataset.type;
        filterChannels();
    };
});

adminHiddenBtn.addEventListener('click', function() { window.open('admin.html', '_blank'); });
noticeCloseBtn.addEventListener('click', function() { noticeBar.classList.remove('show'); });

function scrollChannelListToTop() { if (listBar) listBar.scrollTop = 0; }
var originalRender = renderChannels;
renderChannels = function() { originalRender(); setTimeout(scrollChannelListToTop, 150); };
var originalFilter = filterChannels;
filterChannels = function() { originalFilter(); setTimeout(scrollChannelListToTop, 100); };

function applyTelegramLink(link) {
    if (link && link.trim() !== '') {
        telegramFloatBtn.href = link.trim();
        telegramFloatBtn.classList.add('show');
    } else {
        telegramFloatBtn.classList.remove('show');
    }
}
applyTelegramLink(localStorage.getItem('telegramLink') || '');

refreshAllAdSlots();
loadFromServer();
console.log('LiveTV Player loaded (100% Secure)');
console.log('Total channels: ' + allChannels.length);
console.log('Admin access: Click gear button at bottom-right');
</script>
